name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Lint and test
        run: |
          npm run lint
          npm test
      - name: Set Pages base path
        shell: bash
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH }}
        run: |
          if [[ -n "$PAGES_BASE_PATH" ]]; then
            base_path="$PAGES_BASE_PATH"
          else
            repository="${GITHUB_REPOSITORY#*/}"
            owner="${GITHUB_REPOSITORY%%/*}"
            if [[ "$repository" == "$owner.github.io" ]]; then
              base_path="/"
            else
              base_path="/$repository/"
            fi
          fi
          if [[ "$base_path" != /*/ ]]; then
            echo "PAGES_BASE_PATH must begin and end with /." >&2
            exit 1
          fi
          echo "VITE_BASE_PATH=$base_path" >> "$GITHUB_ENV"
      - name: Build production app
        run: npm run build
      - name: Install browser for deployment smoke test
        run: npx playwright install --with-deps chromium
      - name: Test Pages base path
        run: npm run test:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
